<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学习资料站 - 学生必备</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f7fa;
            color: #333;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 60px 20px 50px;
            text-align: center;
            color: #fff;
        }
        .header h1 { font-size: 36px; margin-bottom: 10px; }
        .header p { font-size: 16px; opacity: 0.9; }
        .container { max-width: 1000px; margin: 0 auto; padding: 30px 20px; }

        .filter-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .filter-bar button {
            padding: 8px 20px;
            border: 2px solid #667eea;
            background: transparent;
            color: #667eea;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
        }
        .filter-bar button.active, .filter-bar button:hover {
            background: #667eea;
            color: #fff;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        .card {
            background: #fff;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }
        .card-img {
            height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }
        .card-body { padding: 16px 18px 20px; }
        .card-body h3 { font-size: 16px; margin-bottom: 6px; }
        .card-body p { font-size: 13px; color: #888; line-height: 1.5; }
        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
        }
        .price { font-size: 18px; font-weight: 700; color: #e74c3c; }
        .price span { font-size: 13px; color: #999; font-weight: 400; }
        .badge {
            padding: 3px 10px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 600;
        }
        .badge-free { background: #e8f5e9; color: #2e7d32; }
        .badge-pay { background: #fff3e0; color: #e65100; }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal.active { display: flex; }
        .modal-box {
            background: #fff;
            border-radius: 20px;
            max-width: 480px;
            width: 100%;
            padding: 30px;
            text-align: center;
            animation: pop 0.3s ease-out;
        }
        @keyframes pop {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .modal-box h2 { margin-bottom: 8px; font-size: 20px; }
        .modal-box .desc { color: #666; font-size: 14px; margin-bottom: 20px; }
        .qr-box {
            width: 200px; height: 200px;
            background: #f0f0f0;
            margin: 0 auto 16px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
        }
        .modal-box .tip { font-size: 13px; color: #999; margin-bottom: 20px; }
        .modal-box .btn-close {
            padding: 10px 30px;
            background: #667eea;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            cursor: pointer;
        }

        .footer {
            text-align: center;
            padding: 30px;
            color: #999;
            font-size: 13px;
        }

        /* 免费资料直接展示 */
        .free-content {
            background: #fff;
            border-radius: 16px;
            padding: 30px;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
        }
        .free-content h2 { color: #667eea; margin-bottom: 16px; }
        .free-content ul { padding-left: 20px; line-height: 2; color: #555; }
        .free-content .download-btn {
            display: inline-block;
            margin-top: 16px;
            padding: 12px 30px;
            background: #667eea;
            color: #fff;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
        }
        .free-content .download-btn:hover { background: #5a6fd6; }
    </style>
</head>
<body>
    <div class="header">
        <h1>📚 学习资料站</h1>
        <p>初中·高中·大学 · 学生必备资料</p>
    </div>
    <div class="container">
        <div class="filter-bar">
            <button class="active" onclick="filter('all')">全部</button>
            <button onclick="filter('free')">免费</button>
            <button onclick="filter('pay')">付费</button>
            <button onclick="filter('zhongkao')">中考</button>
            <button onclick="filter('gaokao')">高考</button>
            <button onclick="filter('other')">其他</button>
        </div>

        <div class="grid" id="grid"></div>

        <!-- 免费资料弹窗 -->
        <div class="modal" id="modal">
            <div class="modal-box">
                <div class="qr-box">💰</div>
                <h2 id="modalTitle">资料标题</h2>
                <p class="desc" id="modalDesc">扫码支付 9.9 元后获取提取码</p>
                <p class="tip">💡 截图扫码 → 微信/支付宝支付 → 截图发我获取资料</p>
                <button class="btn-close" onclick="closeModal()">我知道了</button>
            </div>
        </div>
    </div>
    <div class="footer">
        🦀 小螃蟹学习资料站 · 持续更新中
    </div>

    <script>
        // 资料数据 - 免费的直接展示，付费的弹窗
        const items = [
            {
                id: 1,
                title: '中国近代史时间轴（中考版）',
                desc: '1840-1949完整时间线·背景·意义·高频考点',
                emoji: '📜',
                color: '#fff3e0',
                category: 'free',
                price: '免费',
                badge: 'free',
                badgeText: '免费',
                file: '中国近代史时间轴_中考版.docx'
            },
            {
                id: 2,
                title: '中考英语高频词汇500',
                desc: '最常考的500个单词·例句·记忆口诀',
                emoji: '📝',
                color: '#e3f2fd',
                category: 'pay',
                price: '9.9',
                badge: 'pay',
                badgeText: '付费'
            },
            {
                id: 3,
                title: '初中数学公式大全',
                desc: '代数·几何·概率 全覆盖，考前速记',
                emoji: '📐',
                color: '#fce4ec',
                category: 'pay',
                price: '6.9',
                badge: 'pay',
                badgeText: '付费'
            },
            {
                id: 4,
                title: '高中文言文实词150',
                desc: '课内+课外必考实词·例句·翻译',
                emoji: '📖',
                color: '#f3e5f5',
                category: 'pay',
                price: '9.9',
                badge: 'pay',
                badgeText: '付费'
            },
            {
                id: 5,
                title: 'PPT模板精选20套',
                desc: '答辩·汇报·小组展示·颜值在线',
                emoji: '🎨',
                color: '#e8f5e9',
                category: 'pay',
                price: '5.9',
                badge: 'pay',
                badgeText: '付费'
            },
            {
                id: 6,
                title: 'Excel常用公式速查表',
                desc: 'VLOOKUP·IF·SUMIF·数据透视表',
                emoji: '📊',
                color: '#fff8e1',
                category: 'pay',
                price: '4.9',
                badge: 'pay',
                badgeText: '付费'
            },
            {
                id: 7,
                title: '作文素材·金句100条',
                desc: '人物·名言·时事·万能开头结尾',
                emoji: '✍️',
                color: '#e0f2f1',
                category: 'free',
                price: '免费',
                badge: 'free',
                badgeText: '免费'
            },
            {
                id: 8,
                title: '考研英语作文模板',
                desc: '大作文+小作文·万能套用',
                emoji: '🎯',
                color: '#fbe9e7',
                category: 'pay',
                price: '12.9',
                badge: 'pay',
                badgeText: '付费'
            },
        ];

        function render(filterType) {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            const filtered = filterType === 'all' ? items : items.filter(i => i.category === filterType || i.category === filterType);
            filtered.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                if (item.category === 'free') {
                    card.onclick = () => window.open(item.file, '_blank');
                } else {
                    card.onclick = () => openModal(item);
                }
                card.innerHTML = `
                    <div class="card-img" style="background:${item.color}">${item.emoji}</div>
                    <div class="card-body">
                        <h3>${item.title}</h3>
                        <p>${item.desc}</p>
                        <div class="card-footer">
                            <div class="price">${item.price === '免费' ? '免费' : '¥' + item.price} <span>${item.price === '免费' ? '' : '/份'}</span></div>
                            <span class="badge badge-${item.badge}">${item.badgeText}</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filter(type) {
            document.querySelectorAll('.filter-bar button').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            render(type);
        }

        function openModal(item) {
            document.getElementById('modalTitle').textContent = item.title;
            document.getElementById('modalDesc').textContent = '扫码支付 ¥' + item.price + ' 后截图发我获取资料';
            document.getElementById('modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        render('all');
    </script>
</body>
</html>
