<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>李源杰大王</title>
    <meta property="og:title" content="👑 李源杰大王">
    <meta property="og:description" content="点开有惊喜">
    <meta property="og:image" content="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'%3E%3Ctext y='140' font-size='140' text-anchor='middle'%3E🦀%3C/text%3E%3C/svg%3E">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 32px;
            padding: 48px 36px;
            max-width: 420px;
            width: 90%;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.8s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .emoji-big {
            font-size: 80px;
            display: block;
            margin-bottom: 8px;
            animation: wave 2s ease-in-out infinite;
        }
        @keyframes wave {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-10deg); }
            75% { transform: rotate(10deg); }
        }
        h1 {
            color: #fff;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .badge {
            display: inline-block;
            background: linear-gradient(90deg, #f59e0b, #ef4444);
            color: #fff;
            padding: 4px 18px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 24px;
        }
        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            margin: 20px 0;
        }
        .kids-list {
            list-style: none;
            padding: 0;
        }
        .kids-list li {
            display: inline-block;
            color: rgba(255, 255, 255, 0.9);
            font-size: 17px;
            font-weight: 500;
            padding: 8px 16px;
            margin: 4px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.2s;
        }
        .kids-list li:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: translateY(-2px);
        }
        .footer {
            margin-top: 24px;
            color: rgba(255, 255, 255, 0.3);
            font-size: 13px;
        }
        .sparkles {
            position: fixed;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }
    </style>
</head>
<body>
    <canvas class="sparkles" id="sparkles"></canvas>
    <div class="card">
        <span class="emoji-big">🦀</span>
        <h1>李源杰 👑</h1>
        <div class="badge">🏆 最佳爸爸</div>
        <div class="divider"></div>
        <p style="color:rgba(255,255,255,0.6); font-size:15px; margin-bottom:16px;">他是这六位大神的爸爸</p>
        <ul class="kids-list">
            <li>陈嘉川</li>
            <li>张师千</li>
            <li>尉君阳</li>
            <li>刘锦朴</li>
            <li>韩伟博</li>
            <li>李宇轩</li>
        </ul>
        <div class="divider"></div>
        <p style="color:rgba(255,255,255,0.4); font-size:14px;">🦀 小螃蟹 · 为大王献上</p>
    </div>

    <script>
        // 打开页面即弹窗
        window.addEventListener('load', function() {
            // 播放搞怪音效
            try {
                var ctx = new (window.AudioContext || window.webkitAudioContext)();
                function playNote(freq, dur, start) {
                    var osc = ctx.createOscillator();
                    var gain = ctx.createGain();
                    osc.type = 'square';
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.3, start);
                    gain.gain.exponentialRampToValueAtTime(0.01, start + dur);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(start);
                    osc.stop(start + dur);
                }
                // 搞怪上滑音效 - 像超级马里奥吃蘑菇
                playNote(262, 0.1, ctx.currentTime);
                playNote(330, 0.1, ctx.currentTime + 0.1);
                playNote(392, 0.1, ctx.currentTime + 0.2);
                playNote(523, 0.3, ctx.currentTime + 0.3);
            } catch(e) {}

            setTimeout(function() {
                alert('李源杰是陈嘉川张师千尉君阳刘锦朴韩伟博李宇轩的爸爸');
            }, 800);
        });

        // 粒子特效 - 后台运行不影响弹窗
        const canvas = document.getElementById('sparkles');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        const particles = Array.from({ length: 60 }, () => ({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            size: Math.random() * 3 + 1,
            speedX: (Math.random() - 0.5) * 0.8,
            speedY: (Math.random() - 0.5) * 0.8,
            opacity: Math.random() * 0.5 + 0.2
        }));

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.x += p.speedX;
                p.y += p.speedY;
                if (p.x < 0) p.x = canvas.width;
                if (p.x > canvas.width) p.x = 0;
                if (p.y < 0) p.y = canvas.height;
                if (p.y > canvas.height) p.y = 0;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${p.opacity})`;
                ctx.fill();
            });
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
